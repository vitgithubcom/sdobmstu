events {
    worker_connections 1024;
}

http {
    upstream go_backend {
        # Балансировка между несколькими инстансами Go (если нужно)
        server go-app:8084;
        keepalive 32;  # Держим соединения открытыми
    }

    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 84;
        server_name localhost;

        # Отключаем буферизацию для быстрых ответов
        proxy_buffering off;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # Основной эндпоинт
        location / {
            proxy_pass http://go_backend;
            
            # Правильные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты (для диагностики)
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            # Keep-Alive
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Статус Nginx (для мониторинга)
        location /nginx-status {
            stub_status on;
            allow 127.0.0.1;
            allow 172.0.0.0/8;
            deny all;
        }
    }

    # Дополнительный сервер на порту 8443 для HTTPS (если нужно)
    # server {
    #     listen 8443 ssl;
    #     server_name localhost;
    #     
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     
    #     location / {
    #         proxy_pass http://go_backend;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }
}