services:
  postgres:
    image: postgres:16-alpine
    container_name: pulse-v-2-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-pulse_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pulse_pass}
      POSTGRES_DB: ${DB_NAME:-pulse_db}
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pulse-v-2_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - pulse-v-2_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pulse_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulse-v-2-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-pulse_user}
      DB_PASSWORD: ${DB_PASSWORD:-pulse_pass}
      DB_NAME: ${DB_NAME:-pulse_db}
      JWT_SECRET: ${JWT_SECRET:-super-secret-key}
      PORT: ${BACKEND_PORT:-8082}
    ports:
      - "${BACKEND_PORT:-8082}:${BACKEND_PORT:-8082}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pulse-v-2_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulse-v-2-frontend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
    networks:
      - pulse-v-2_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: pulse-v-2-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - pulse-v-2_network
    restart: unless-stopped

networks:
  pulse-v-2_network:
    driver: bridge

volumes:
  pulse-v-2_postgres_data: