services:
  traefik:
    image: traefik:v3.7
    container_name: pulse-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/letsencrypt:/letsencrypt"
    networks:
      - pulse-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: pulse-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-pulse_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pulse_pass}
      POSTGRES_DB: ${DB_NAME:-pulse_db}
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pulse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pulse_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulse-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-pulse_user}
      DB_PASSWORD: ${DB_PASSWORD:-pulse_pass}
      DB_NAME: ${DB_NAME:-pulse_db}
      JWT_SECRET: ${JWT_SECRET:-super-secret-key}
      PORT: 8082
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pulse-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pulse-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.pulse-api.entrypoints=websecure"
      - "traefik.http.routers.pulse-api.tls.certresolver=le"
      - "traefik.http.services.pulse-api.loadbalancer.server.port=8082"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulse-frontend
    depends_on:
      - backend
    networks:
      - pulse-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pulse-frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.pulse-frontend.entrypoints=websecure"
      - "traefik.http.routers.pulse-frontend.tls.certresolver=le"
      - "traefik.http.routers.pulse-frontend.priority=1"
      - "traefik.http.services.pulse-frontend.loadbalancer.server.port=80"
    restart: unless-stopped

networks:
  pulse-network:
    driver: bridge

volumes:
  postgres_data: